  @page { size: 80mm 28mm; margin: 0; }
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:80mm; height:28mm; background:#fff; overflow:hidden; }

  .ad {
    width:80mm; height:28mm;
    border:0.35mm solid #000;
    display:grid;
    grid-template-columns:20mm 1fr;
    overflow:hidden;
  }

  /* LOGO */
  .col-logo {
    border-right:0.35mm solid #000;
    display:flex; align-items:center; justify-content:center;
    padding:0.6mm 0.6mm 0.6mm 1mm;
    position:relative;
  }
  .col-logo::before {
    content:''; position:absolute; left:0; top:0; bottom:0;
    width:0.5mm; background:#000;
  }
  .col-logo img {
    width:17mm; height:17mm; object-fit:contain;
    filter:grayscale(100%) contrast(1.1);
    mix-blend-mode:multiply;
  }

  /* RECHTS */
  .col-content { display:flex; flex-direction:column; }

  /* Header – fest 4.8mm hoch */
  .top-bar {
    background:#000; color:#fff;
    padding:0.4mm 1.3mm;
    display:flex; align-items:center; justify-content:space-between;
    height:4.8mm;
  }
  .top-name {
    font-family:'Oswald',Arial,sans-serif;
    font-size:3.8mm; font-weight:700;
    letter-spacing:0.2mm; text-transform:uppercase; line-height:1;
  }
  .top-location {
    font-family:'OSBold',Arial,sans-serif;
    font-size:1.9mm; letter-spacing:0.15mm;
    text-transform:uppercase; opacity:0.6;
  }

  /* Headline – 2 Zeilen, fest 10.5mm hoch */
  .headline-block {
    padding:0.6mm 1.3mm 0 1.3mm;
    height:10.5mm; overflow:hidden;
  }
  .accent-bar { width:3mm; height:0.45mm; background:#000; margin-bottom:0.5mm; }
  .hl {
    font-family:'Oswald',Arial,sans-serif;
    font-size:4.9mm; font-weight:700;
    text-transform:uppercase; line-height:1.0; color:#000;
    display:block;
  }

  /* Trennlinie */
  .rule { height:0.2mm; background:#000; opacity:0.2; margin:0 1.3mm; }

  /* Services */
  .services-block { padding:0.35mm 1.3mm; height:3.2mm; overflow:hidden; }
  .services-row { display:flex; align-items:center; }
  .svc {
    font-family:'OSBold',Arial,sans-serif;
    font-size:2.0mm; font-weight:700;
    text-transform:uppercase; color:#000;
  }
  .svc-sep { font-size:1.9mm; padding:0 0.35mm; opacity:0.3; }

  /* Kontakt */
  .contact-block {
    padding:0.2mm 1.3mm 0.4mm;
    height:2.8mm; overflow:hidden;
    display:flex; gap:0 1.5mm;
  }
  .cl { font-family:'OSBold',Arial,sans-serif; font-size:2mm; color:#333; white-space:nowrap; }

  /* Footer */
  .footer-bar {
    background:#000; color:#fff;
    padding:0.6mm 1.3mm;
    display:flex; align-items:center; justify-content:space-between;
    height:6.5mm;
  }
  .tel {
    font-family:'Oswald',Arial,sans-serif;
    font-size:4.8mm; font-weight:700;
    display:flex; align-items:baseline; gap:0.5mm; line-height:1;
  }
  .tel-label {
    font-family:'OSBold',Arial,sans-serif;
    font-size:1.9mm; letter-spacing:0.2mm; opacity:0.7; text-transform:uppercase;
  }
  .web { font-family:'OSBold',Arial,sans-serif; font-size:2mm; }
</style>
</head>
<body>
<div class="ad">
  <div class="col-logo">
    <img src="logo_color.png" alt="Logo">
  </div>
  <div class="col-content">
    <div class="top-bar">
      <span class="top-name">Sylwester Hulboj</span>
      <span class="top-location">Remseck am Neckar</span>
    </div>
    <div class="headline-block">
      <div class="accent-bar"></div>
      <span class="hl">Gartenbau</span>
      <span class="hl">Gartengestaltung</span>
    </div>
    <div class="rule"></div>
    <div class="services-block">
      <div class="services-row">
        <span class="svc">Gartenpflege</span>
        <span class="svc-sep">·</span>
        <span class="svc">Anlagenpflege</span>
        <span class="svc-sep">·</span>
        <span class="svc">Pflasterarbeiten</span>
        <span class="svc-sep">·</span>
        <span class="svc">Rollrasen</span>
      </div>
    </div>
    <div class="contact-block">
      <div class="cl">Sprengerstr. 4/2 &middot; 71686 Remseck am Neckar</div>
      <div class="cl">sylwester-gartenbau@web.de</div>
    </div>
    <div class="footer-bar">
      <div class="tel"><span class="tel-label">Tel.</span>0157 &ndash; 50720150</div>
      <div class="web">www.sylwester-gartenbau.de</div>
    </div>
  </div>
</div>
</body>
</html>
